# 字段说明：
#   user_id  - 记忆系统里的用户标识
#   api_key  - 预注册智能体的 API Key（Proxy 调记忆接口用）
#   scene_id - 预注册场景（数据隔离）
#   agent_id - 预注册智能体
# ============================================================

