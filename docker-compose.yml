# ============================================================
# 智能体记忆系统 — Docker Compose 统一部署
#
# 说明：
#   - 统一在仓库根目录管理配置
#   - 提供前端、后端、数据库、消息队列统一编排
#   - 统一使用 .env.example / .env
#
# 启动方式：
#   cp .env.example .env
#   docker compose up --build -d
#
# 服务端口：
#   前端       8081
#   后端       8000
#   Kafka      9092
#   Kafka UI   8080
#   Oracle 26ai 在宿主机独立运行（127.0.0.1:1521, PDB=FREEPDB1, DEVUSER）
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: mem-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}

  kafka:
    image: apache/kafka:3.7.2
    container_name: mem-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "9093:9093"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9094
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mem-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

  backend:
    build:
      context: ./memProject
      dockerfile: Dockerfile
    container_name: mem-backend
    restart: unless-stopped
    env_file:
      - ./.env
    extra_hosts:
      # 让 Linux 上容器能访问宿主机 Oracle（host.docker.internal → host-gateway）
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ORACLE_HOST: ${ORACLE_HOST:-host.docker.internal}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_USER: ${ORACLE_USER:-DEVUSER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-DevPassword123}
      ORACLE_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9093}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-BAAI/bge-m3}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://openmemory:8765/mcp}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    # Oracle 26ai 在宿主机独立运行；首次先幂等建表/建索引再启动服务
    command: sh -c "python scripts/oracle_bootstrap.py && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

  frontend:
    build:
      context: ./agent-memory-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-30000}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-智能体记忆系统前端}
    container_name: mem-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-Asia/Shanghai}

volumes:
  kafka_data:

networks:
  default:
    name: mem-network
